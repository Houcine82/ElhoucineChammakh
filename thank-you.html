<!doctype html>
<html lang="ar-MA" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link rel="icon" href="data:,">
<title>شكرا! وصلني الطلب ديالك</title>
<style>
/* PLACEHOLDER thank-you page: the real one gets sketched later */
:root{--bg:#fff;--ink:#17201b;--muted:#56615b;--cta:#157f3b;--line:#dfe4e0;--warm:#f6f4ef;
  --font:system-ui,-apple-system,"Segoe UI","Noto Sans Arabic","Geeza Pro",Tahoma,Arial,sans-serif}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font:600 17px/1.75 var(--font);font-synthesis:none}
h1{font-weight:600}
main{flex:1;display:grid;place-items:center;padding:40px 16px;text-align:center}
.check{width:72px;height:72px;margin:0 auto 18px;border-radius:50%;background:#ebf8ee;display:grid;place-items:center}
.check svg{width:38px;height:38px;fill:none;stroke:var(--cta);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
h1{margin:0;font-size:26px;line-height:1.4}
p{margin:8px 0 0;color:var(--muted)}
/* the number we call from + a button that opens the phone's "add contact" screen (vCard) */
.num{margin:14px 0 0;color:var(--ink);font-size:26px;letter-spacing:.04em}
.save{display:inline-flex;align-items:center;gap:8px;max-width:340px;margin-top:14px;padding:12px 20px;line-height:1.5;border:1.5px solid var(--cta);border-radius:12px;color:var(--cta);font:inherit;font-size:16px;text-decoration:none}
.save svg{flex:none;width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
footer{padding:20px 16px;border-top:1px solid var(--line);background:var(--warm);color:var(--muted);font-size:13px;text-align:center}
</style>
</head>
<body>
<main>
  <div>
    <div class="check"><svg viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></div>
    <h1>شكرا! وصلني الطلب ديالك</h1>
    <p id="when">غادي نعيط ليك قريب من هاد الرقم:</p>
    <p class="num"><bdi dir="ltr">06 05 12 55 57</bdi></p>
    <a class="save" href="elhoucine-chammakh.vcf"><svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg>سجّل الرقم فالتيليفون ديالك باش تعرفني أنا اللي كانصوني عليك</a>
    <script>
    // Outside calling hours (Morocco time) say when the call will actually come.
    (function(){
      var CALLS_START = 10, CALLS_END = 20; // calling hours, 24h
      var h; try { h = +new Intl.DateTimeFormat('en-GB', { hour: '2-digit', hourCycle: 'h23', timeZone: 'Africa/Casablanca' }).format(new Date()); } catch(e) { return; }
      var day = h >= CALLS_END ? 'غدا' : h < CALLS_START ? 'اليوم' : null;
      if (day) document.getElementById('when').textContent = 'غادي نعيط ليك ' + day + ' ابتداء من ' + CALLS_START + ':00 ديال الصباح، من هاد الرقم:';
    })();
    </script>
  </div>
</main>
<footer dir="ltr">© 2026 CHAMMAKH EL HOUCINE · Fès, Maroc</footer>
<script>
var CONFIG = { pixelId: "1706207423798184" }; // same dataset as the landing page
(function(){
  var w = window, d = document, eid = new URLSearchParams(location.search).get("eid");
  try { eid = eid || sessionStorage.getItem("lead_event_id"); } catch(e){}
  function fire(){
    if (!CONFIG.pixelId || !eid) return; // opened directly (no lead) => nothing fires
    try { if (localStorage.getItem("lead_fired_"+eid)) return; } catch(e){} // a refresh doesn't count twice
    !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};
    if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version="2.0";n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;
    s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(w,d,"script","https://connect.facebook.net/en_US/fbevents.js");
    fbq("init", CONFIG.pixelId); fbq("track", "PageView");
    fbq("track", "Lead", {}, { eventID: eid }); // same name + ID as the worker's CAPI event => deduplicated
    try { localStorage.setItem("lead_fired_"+eid, "1"); } catch(e){}
  }
  d.readyState === "complete" ? fire() : w.addEventListener("load", fire);
})();
</script>
</body>
</html>
